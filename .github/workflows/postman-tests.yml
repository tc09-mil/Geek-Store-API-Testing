name: Postman API Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman collection
        run: |
          newman run "Geek Store API Tests.postman_collection.json" \
            -e "Geek Store - Environment.postman_environment.json"
